name: Build and Test

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            tool4d_archive: tool4d_arm64.tar.xz
            tool4d_executable: tool4d.app/Contents/MacOS/tool4d
            build_cmd: xcodebuild -project example/example.xcodeproj -target example -configuration Debug build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          - os: windows-latest
            platform: win
            arch: x64
            tool4d_archive: tool4d_win.tar.xz
            tool4d_executable: tool4d/tool4d.exe
            build_cmd: msbuild example/example.sln /p:Configuration=Debug /p:Platform=x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Parse 4D version from .4DProject
        id: version
        shell: bash
        run: |
          # Extract compatibilityVersion (e.g. 2101 → branch=21.x, version=21.1)
          compat=$(cat example/example-test/Project/example.4DProject | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data['compatibilityVersion'])
          ")
          
          # Parse: first 2 chars = major, next 2 = minor
          # 2101 → major=21, minor=01 → 21.1
          # 2120 → major=21, minor=20 → 21 R2
          major=${compat:0:2}
          minor_raw=${compat:2:2}
          
          # Convert minor: 01-09 = dot release, 10+ = Rx release
          minor_dec=$((10#$minor_raw))
          
          if [ $minor_dec -lt 10 ]; then
            version="${major}.${minor_dec}"
          else
            r_version=$((minor_dec / 10))
            version="${major} R${r_version}"
          fi
          
          branch="${major}.x"
          
          echo "branch=${branch}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "Resolved 4D version: ${version} (branch: ${branch})"

      - name: Download tool4d
        shell: bash
        run: |
          url="https://resources-download.4d.com/release/${{ steps.version.outputs.branch }}/${{ steps.version.outputs.version }}/latest/${{ matrix.platform }}/${{ matrix.tool4d_archive }}"
          echo "Downloading tool4d from: ${url}"
          curl "${url}" -o tool4d.tar.xz -sL
          tar xJf tool4d.tar.xz

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Run tests
        shell: bash
        run: |
          ${{ matrix.tool4d_executable }} \
            --dataless \
            --startup-method=test_all \
            --project=$(pwd)/example/example-test/Project/example.4DProject
